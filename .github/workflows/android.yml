name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Set up signing key (only if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing key found: the release bundle will be signed."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the release bundle will be unsigned (Google Play won't accept it)."
          fi

      - name: Build debug APK and release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload debug APK (install on your phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: night-watch-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release bundle (upload this to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: night-watch-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
